name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: access
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/access
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/access_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: pip install -r requirements-dev.txt

      - name: lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: apply migrations
        run: alembic upgrade head

      - name: create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE access_test'

      - name: tests
        run: pytest -v

      - name: build image
        run: docker build -t access-management-service:${{ github.sha }} .
